name: Discover firmware candidate

on:
  workflow_call:
    inputs:
      policy-path:
        description: Repository-relative track policy path
        required: true
        type: string
      manifests-dir:
        description: Repository-relative merged manifests directory
        required: true
        type: string
    outputs:
      status:
        description: Either current or candidate
        value: ${{ jobs.detect.outputs.status }}
      result:
        description: Canonical discovery decision JSON
        value: ${{ jobs.detect.outputs.result }}
      appledb_commit:
        description: Exact AppleDB commit used for release metadata and IPSW lookup
        value: ${{ jobs.detect.outputs.appledb_commit }}

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      status: ${{ steps.discover.outputs.status }}
      result: ${{ steps.discover.outputs.result }}
      appledb_commit: ${{ steps.discover.outputs.appledb_commit }}
    steps:
      - name: Checkout shard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shard
          persist-credentials: false

      - name: Checkout detector at called workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: catalog
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync locked detector environment
        working-directory: catalog
        run: uv sync --locked --all-groups

      - name: Cache AppleDB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ipsw-config/appledb
          key: appledb-v2-${{ runner.os }}

      - name: Install latest stable ipsw (checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash catalog/scripts/install-latest-ipsw.sh

      - name: Resolve reviewed track selector
        id: selector
        env:
          POLICY_PATH: ${{ inputs.policy-path }}
        run: |
          set -euo pipefail
          policy="shard/$POLICY_PATH"
          platform="$(jq --exit-status --raw-output \
            '.appledb_platform | select(. == "iOS" or . == "iPadOS" or . == "macOS")' \
            "$policy")"
          device="$(jq --exit-status --raw-output \
            '.device | select(test("^[A-Za-z0-9][A-Za-z0-9,._-]*$"))' "$policy")"
          major="$(jq --exit-status --raw-output \
            '.major_version | select(type == "number" and floor == . and . > 0)' "$policy")"
          {
            printf 'platform=%s\n' "$platform"
            printf 'device=%s\n' "$device"
            printf 'major=%s\n' "$major"
          } >> "$GITHUB_OUTPUT"

      - name: Query complete exact-track IPSW source inventory
        env:
          PLATFORM: ${{ steps.selector.outputs.platform }}
          DEVICE: ${{ steps.selector.outputs.device }}
          MAJOR: ${{ steps.selector.outputs.major }}
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/ipsw-config"
          mkdir -p "$config_dir"
          touch "$config_dir/config.yaml"
          ipsw --config "$config_dir/config.yaml" dl appledb \
            --os "$PLATFORM" \
            --device "$DEVICE" \
            --version "$MAJOR." \
            --type ipsw \
            --json \
            --no-color > "$RUNNER_TEMP/ipsw-sources.json"
          if ! jq --exit-status '
            type == "object" and .schema_version == 1 and
            (.releases | type == "array" and length > 0)
          ' "$RUNNER_TEMP/ipsw-sources.json" >/dev/null; then
            echo 'Expected nonempty ipsw AppleDB schema_version=1 releases envelope' >&2
            exit 1
          fi
          appledb_commit="$(git -C "$config_dir/appledb" rev-parse HEAD)"
          [[ "$appledb_commit" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$appledb_commit" > "$RUNNER_TEMP/appledb-commit"

      - name: Queue every consecutive exact-track build
        id: discover
        working-directory: catalog
        env:
          POLICY_PATH: ${{ inputs.policy-path }}
          MANIFESTS_DIR: ${{ inputs.manifests-dir }}
        run: |
          set -euo pipefail
          appledb_commit="$(cat "$RUNNER_TEMP/appledb-commit")"
          result="$(uv run ipsw-diff-catalog discover \
            --policy "../shard/$POLICY_PATH" \
            --manifests-dir "../shard/$MANIFESTS_DIR" \
            --appledb-repo "$RUNNER_TEMP/ipsw-config/appledb" \
            --appledb-commit "$appledb_commit" \
            --ipsw-sources "$RUNNER_TEMP/ipsw-sources.json")"
          status="$(printf '%s' "$result" | jq --exit-status --raw-output '.status')"
          if [ "$status" != current ] && [ "$status" != candidate ]; then
            echo "unsupported discovery status: $status" >&2
            exit 1
          fi
          printf '%s\n' "$result" | tee "$RUNNER_TEMP/discovery.json"
          {
            printf 'status=%s\n' "$status"
            printf 'result=%s\n' "$result"
            printf 'appledb_commit=%s\n' "$appledb_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Verify repositories unchanged
        if: always()
        run: |
          set -euo pipefail
          shard_status="$(git -C shard status --porcelain=v1 --untracked-files=all)"
          catalog_status="$(git -C catalog status --porcelain=v1 --untracked-files=all)"
          if [ -n "$shard_status" ] || [ -n "$catalog_status" ]; then
            printf 'shard status:\n%s\ncatalog status:\n%s\n' \
              "$shard_status" "$catalog_status" >&2
            exit 1
          fi

      - name: Summarize decision
        run: |
          heading="$(jq --exit-status --raw-output \
            '"### \(.platform) \(.major_version) firmware discovery"' \
            "$RUNNER_TEMP/discovery.json")"
          {
            printf '%s\n' "$heading"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/discovery.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
